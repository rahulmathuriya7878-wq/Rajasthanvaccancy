    <!-- Dynamic JSON-LD FAQ Schema Generator -->
    <script>
      (function() {
        function generateDynamicFaqSchema() {
          try {
            var defaultFaqs = [
              {
                q: "राजस्थान सरकारी भर्तियों के लिए SSO ID से ऑनलाइन आवेदन कैसे करें?",
                a: "sso.rajasthan.gov.in पर लॉगिन करें, Recruitment Portal चुनें, One Time Registration (OTR) पूरा करें और इच्छित भर्ती के सामने Apply Now पर क्लिक करें।"
              },
              {
                q: "One Time Registration (OTR) फीस कितनी है?",
                a: "सामान्य व क्रीमीलेयर पिछड़ा वर्ग के लिए ₹600/- तथा राजस्थान के नॉन-क्रीमीलेयर OBC/EWS/SC/ST/PH के लिए ₹400/-। एक बार भुगतान के बाद सभी भर्ती फॉर्म निःशुल्क हैं।"
              },
              {
                q: "राजस्थान सरकारी योजनाओं के लिए कौन से दस्तावेज जरूरी हैं?",
                a: "जन आधार कार्ड (Jan Aadhaar Card), मूल निवास प्रमाण पत्र, आय प्रमाण पत्र और आधार कार्ड अनिवार्य हैं।"
              },
              {
                q: "नवीनतम परीक्षा परिणाम एवं प्रवेश पत्र कैसे डाउनलोड करें?",
                a: "वेबसाइट के मेनू में 'Admit Card' या 'Result' सेक्शन पर क्लिक करें और संबंधित भर्ती के आधिकारिक लिंक से तुरंत डाउनलोड करें।"
              }
            ];

            var collectedFaqs = [];
            var seenQuestions = {};

            // 1. Check if a specific vacancy is selected via URL param ?vacancy=...
            var params = new URLSearchParams(window.location.search);
            var targetVacancyId = params.get('vacancy');

            // 2. Scan localStorage for currently stored vacancies
            var storedVacancies = null;
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('raj_vacancies') === 0) {
                try {
                  var data = JSON.parse(localStorage.getItem(key));
                  if (Array.isArray(data) && data.length > 0) {
                    storedVacancies = data;
                    break;
                  }
                } catch (e) {}
              }
            }

            if (storedVacancies && Array.isArray(storedVacancies)) {
              // Priority: Active vacancy FAQs if one is targeted
              if (targetVacancyId) {
                var currentVac = storedVacancies.find(function(v) { return v.id === targetVacancyId; });
                if (currentVac && currentVac.faqs && Array.isArray(currentVac.faqs)) {
                  currentVac.faqs.forEach(function(item) {
                    var qText = item.qHi || item.q;
                    var aText = item.aHi || item.a;
                    if (qText && aText && !seenQuestions[qText]) {
                      seenQuestions[qText] = true;
                      collectedFaqs.push({ q: qText, a: aText });
                    }
                  });
                }
              }

              // Also aggregate high-priority FAQs across stored vacancies
              storedVacancies.forEach(function(vac) {
                if (vac.faqs && Array.isArray(vac.faqs)) {
                  vac.faqs.forEach(function(item) {
                    var qText = item.qHi || item.q;
                    var aText = item.aHi || item.a;
                    if (qText && aText && !seenQuestions[qText] && collectedFaqs.length < 20) {
                      seenQuestions[qText] = true;
                      collectedFaqs.push({ q: qText, a: aText });
                    }
                  });
                }
              });
            }

            // Append default FAQs if not already added
            defaultFaqs.forEach(function(item) {
              if (!seenQuestions[item.q]) {
                seenQuestions[item.q] = true;
                collectedFaqs.push(item);
              }
            });

            var faqEntities = collectedFaqs.map(function(faq) {
              return {
                "@type": "Question",
                "name": faq.q,
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": faq.a
                }
              };
            });

            var schemaData = {
              "@context": "https://schema.org",
              "@type": "FAQPage",
              "@id": (window.location.origin || "https://rajasthanvaccancy.vercel.app") + "/#faq",
              "mainEntity": faqEntities
            };

            var scriptEl = document.getElementById('dynamic-faq-schema-ld');
            if (!scriptEl) {
              scriptEl = document.createElement('script');
              scriptEl.id = 'dynamic-faq-schema-ld';
              scriptEl.type = 'application/ld+json';
              document.head.appendChild(scriptEl);
            }
            scriptEl.textContent = JSON.stringify(schemaData, null, 2);
          } catch (err) {
            console.warn('Dynamic FAQ Schema generation notice:', err);
          }
        }

        // Expose dynamic generator to window so React components can trigger it on state changes
        window.updateDynamicFaqSchema = generateDynamicFaqSchema;

        // Run non-blocking using requestIdleCallback to keep Total Blocking Time (TBT) near 0ms
        if (typeof window !== 'undefined' && 'requestIdleCallback' in window) {
          requestIdleCallback(generateDynamicFaqSchema);
        } else {
          setTimeout(generateDynamicFaqSchema, 150);
        }

        // Listen for storage changes across tabs or admin updates
        window.addEventListener('storage', function(e) {
          if (e.key && e.key.indexOf('raj_vacancies') === 0) {
            generateDynamicFaqSchema();
          }
        });

        // Listen for custom app update events and URL navigation
        window.addEventListener('raj_vacancies_updated', generateDynamicFaqSchema);
        window.addEventListener('popstate', generateDynamicFaqSchema);
      })();
    </script>
