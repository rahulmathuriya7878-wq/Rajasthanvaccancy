name: Build & Deploy (Cloudflare Workers)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Next.js persistent build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-cache-${{ hashFiles('bun.lock', 'package-lock.json') }}-${{ hashFiles('src/**/*', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-cache-${{ hashFiles('bun.lock', 'package-lock.json') }}-
            ${{ runner.os }}-nextjs-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript lint check
        run: bun run lint

      - name: Build Next.js & OpenNext Cloudflare bundle
        run: bun run build

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            npx opennextjs-cloudflare deploy
          else
            echo "CLOUDFLARE_API_TOKEN secret not set; skipping CLI deploy (Cloudflare Dashboard Git integration handles deployment)."
          fi
